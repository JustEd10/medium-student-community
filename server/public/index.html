<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Медиум · работа с сервером</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Медиум</h1>
      <div id="userBox"></div>
    </header>

    <main>
      <section id="loginBox" class="card">
        <h2>Вход</h2>
        <form id="loginForm">
          <label for="loginInput">Логин</label>
          <input id="loginInput" name="login" autocomplete="username" required />
          <label for="passwordInput">Пароль</label>
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">Войти</button>
        </form>
        <p id="loginError" class="error" role="alert" aria-live="polite"></p>
      </section>

      <section class="card">
        <h2>Вопросы</h2>
        <div class="row">
          <button id="loadBtn" type="button">Загрузить список</button>
          <label class="sr-only" for="categoryFilter">Категория</label>
          <select id="categoryFilter">
            <option value="">Все категории</option>
          </select>
          <label class="sr-only" for="searchInput">Поиск</label>
          <input id="searchInput" type="search" />
          <label class="sr-only" for="sortSelect">Сортировка</label>
          <select id="sortSelect">
            <option value="new">Сначала новые</option>
            <option value="answers">По числу ответов</option>
          </select>
        </div>
        <div id="items"></div>
      </section>

      <section id="addBox" class="card hidden">
        <h2>Задать вопрос</h2>
        <form id="itemForm">
          <label for="itemTitle">Заголовок (от 8 символов)</label>
          <input id="itemTitle" name="title" required />
          <label for="itemBody">Текст вопроса</label>
          <textarea id="itemBody" name="body"></textarea>
          <label for="itemCategory">Категория</label>
          <select id="itemCategory" name="category"></select>
          <button type="submit">Опубликовать</button>
        </form>
        <p id="itemError" class="error" role="alert" aria-live="polite"></p>
      </section>

      <section id="myBox" class="card hidden">
        <h2>Мои записи</h2>
        <div id="myRecords"></div>
      </section>

      <section class="card">
        <h2>Проверка связи с сервером</h2>
        <button id="demoBtn" type="button">Загрузить демо-список</button>
        <p class="hint">Тестовый массив с /api/demo, он прописан прямо в коде сервера</p>
        <div id="demoList"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>

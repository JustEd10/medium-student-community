name: Frontend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          for source in Path('/etc/apt').rglob('*'):
              if source.is_file() and (source.name == 'sources.list' or source.suffix in ['.sources', '.list']):
                  text = source.read_text()
                  updated = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != text:
                      source.write_text(updated)
          PYTHON
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-checks
          path: |
            playwright-report/
            test-results/
            docs/screenshots/
          retention-days: 7
